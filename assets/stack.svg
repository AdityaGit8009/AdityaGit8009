<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-labelledby="title">
  <title id="title">My toolbox — frontend, backend, data and development tools</title>
  <style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}</style>
  <rect x="1" y="1" width="382" height="226" rx="14" fill="#0C1727" stroke="#2A4054"/>
