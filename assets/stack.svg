  <text x="435" y="205" class="mono" font-size="12" fill="#91A5BF">Logic behind the experience.</text>
  <text x="843" y="41" class="mono" font-size="13" letter-spacing="2" fill="#FBBF24">03 / THE FOUNDATION</text>
