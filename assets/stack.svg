  <rect x="817" y="1" width="382" height="226" rx="14" fill="#0C1727" stroke="#2A4054"/>
  <text x="27" y="41" class="mono" font-size="13" letter-spacing="2" fill="#5EEAD4">01 / THE EXPERIENCE</text>
  <text x="27" y="79" font-size="28" font-weight="650" fill="#F1F5F9">Frontend</text>
