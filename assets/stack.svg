  <text x="27" y="171" font-size="20" fill="#C2D0E2">Bootstrap</text>
  <text x="27" y="205" class="mono" font-size="12" fill="#91A5BF">Interfaces that make sense.</text>
  <text x="435" y="41" class="mono" font-size="13" letter-spacing="2" fill="#93C5FD">02 / THE ENGINE</text>
  <text x="435" y="79" font-size="28" font-weight="650" fill="#F1F5F9">Backend</text>
