<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Aditya Pratap Vishwakarma — developer workspace</title>
  <desc id="desc">Full-stack developer in the making. Java and Spring Boot, PHP and Laravel. A connected interface, API and database diagram.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101D31"/><stop offset="1" stop-color="#080F1D"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5EEAD4"/><stop offset="1" stop-color="#93C5FD"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/></pattern>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .flow { stroke-dasharray: 7 12; animation: flow 5s linear infinite; }
      .cursor { animation: blink 1.5s steps(2, start) infinite; }
      @keyframes flow { to { stroke-dashoffset: -95; } }
      @keyframes blink { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .cursor { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="22" fill="url(#bg)" stroke="#293A51"/>
  <rect x="2" y="2" width="1196" height="436" rx="21" fill="url(#grid)"/>
  <path d="M25 1H1175" stroke="url(#accent)" stroke-width="2"/>
