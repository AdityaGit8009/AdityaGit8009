name: Update GitHub Profile Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/sync_github.py'

permissions:
  contents: read

concurrency:
  group: profile-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Refresh verified GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_github.py
      - name: Validate generated profile
        run: |
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit refreshed charts and project links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub profile data"
            git push origin HEAD:main
          else
            echo "No changes to publish."
          fi
