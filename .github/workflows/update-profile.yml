name: Update GitHub Profile Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/sync_github.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_github.py
      - name: Commit refreshed charts and project links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/contributions.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub profile data"
            git push
          else
            echo "No changes to publish."
          fi
